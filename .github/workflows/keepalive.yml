# Free Supabase projects pause after 7 days without activity.
# This job makes one small read every day so PEMS never pauses.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "Secrets not set yet - skipping"; exit 0; fi
          curl -fsS "$URL/rest/v1/workspaces?select=id&limit=1" -H "apikey: $KEY" -o /dev/null && echo "awake"

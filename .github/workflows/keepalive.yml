# Free Supabase projects pause after 7 days without activity.
# This job makes one small read every day so PEMS never pauses.
# It reads the public Supabase URL and anon key from public/config.js
# (both are public by design), so no secrets are needed.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" public/config.js | head -1)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*" public/config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js not filled yet - skipping"; exit 0; fi
          curl -fsS "$URL/rest/v1/workspaces?select=id&limit=1" -H "apikey: $KEY" -o /dev/null && echo "Supabase is awake"

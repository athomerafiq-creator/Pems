<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEMS — Personal Executive Management System</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060c1d;--side:#081127;--panel:#0c1630;--panel2:#101d3c;--line:#1b2a4e;--text:#e9eefa;--mut:#8d9abb;--blue:#2f6bff;--green:#22c55e;--purple:#8b5cf6;--orange:#f59e0b;--red:#ef4444;--gold:#f5b942;--cyan:#22d3ee}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#6ea0ff;text-decoration:none}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,#0a1530,#060d20);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:26px 22px 22px}
.brand b{font-size:28px;font-weight:800;letter-spacing:.5px;background:linear-gradient(180deg,#ffd77a,#e09a1f);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1}
.brand small{display:block;color:#c9d3ea;font-size:12px;line-height:1.35;margin-top:4px}
.nav{padding:6px 14px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;color:#d3dbef;font-weight:500;margin-bottom:3px;position:relative}
.nav a:hover{background:#111e3d}
.nav a.on{background:linear-gradient(90deg,#1d4fd8,#1c3f9e);color:#fff;box-shadow:0 6px 20px #1d4fd840}
.nav a.locked{opacity:.38}
.nav svg{width:20px;height:20px;flex:none}
.badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.me{border-top:1px solid var(--line);padding:16px 18px}
.me .row{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.me select{width:100%;margin-top:12px;background:#0f1b38;border:1px solid var(--line);border-radius:9px;padding:9px}
.online{color:#9fb0d4;font-size:12px;margin-top:10px;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
/* main */
.main{padding:22px 26px 40px;min-width:0}
.top{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.search{flex:1;max-width:580px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.search input{background:none;border:0;outline:0;padding:11px 0;width:100%}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:42px;min-width:42px;display:grid;place-items:center;cursor:pointer;position:relative;padding:0 12px}
.iconbtn .badge{position:absolute;top:-6px;right:-6px}
.datechip{margin-left:auto;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;white-space:nowrap}
.burger{display:none}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:10px}
.card h3 .lnk{margin-left:auto;font-size:13px;font-weight:500;color:#6ea0ff;cursor:pointer}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);min-height:230px;background:linear-gradient(180deg,#0b1a44 0%,#20306b 45%,#5a4a8a 70%,#1a2550 100%);display:flex;align-items:center;padding:30px 36px}
.hero svg.sky{position:absolute;right:0;bottom:0;height:100%;width:62%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%);mask-image:linear-gradient(90deg,transparent,#000 22%)}
.hero h1{margin:0;font-size:38px;font-weight:800;position:relative}
.hero p{font-style:italic;font-size:19px;color:#dfe6f7;position:relative;margin:12px 0 0}
.focus{position:absolute;right:22px;top:22px;bottom:22px;width:330px;background:#0a1430e6;border:1px solid #2a3a66;border-radius:12px;padding:16px 18px;overflow:auto;backdrop-filter:blur(4px)}
.focus h4{margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:center}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer;color:#dbe3f6}
.chk i{width:18px;height:18px;border-radius:5px;border:2px solid #8d9abb;flex:none;display:grid;place-items:center}
.chk.done i{background:var(--blue);border-color:var(--blue)}
.chk.done span{color:#8d9abb;text-decoration:line-through}
.stat{display:flex;gap:16px;align-items:flex-start;position:relative;overflow:hidden;min-height:128px}
.stat .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat b{font-size:34px;font-weight:800;display:block;line-height:1.1}
.stat small{color:#c8d2ea;font-size:14px}
.stat .delta{display:block;margin-top:10px;font-size:12px}
.stat svg.spark{position:absolute;right:0;bottom:0;width:120px;height:56px}
.sched{position:relative}
.sched .it{display:grid;grid-template-columns:150px 24px 1fr;gap:6px;align-items:start;padding:8px 0}
.sched .tm{color:#c4cde4;font-size:13px;padding-top:2px}
.sched .pin{width:12px;height:12px;border-radius:50%;margin:4px auto 0;position:relative;z-index:1}
.sched .ln{position:absolute;left:161px;top:22px;bottom:22px;width:2px;background:#2b3c69}
.sched b{display:block;font-weight:600}
.sched small{color:var(--mut)}
.legend div{display:flex;align-items:center;gap:12px;padding:8px 0}
.legend i{width:14px;height:14px;border-radius:3px}
.legend span{flex:1}
.legend em{font-style:normal;color:#5fd7ff;font-weight:600}
.fin{display:grid;grid-template-columns:repeat(3,1fr)}
.fin>div{padding:4px 18px}.fin>div+div{border-left:1px solid var(--line)}
.fin b{font-size:26px;font-weight:800;display:block}
.up{color:var(--green)}.dn{color:var(--red)}
.pa{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.pa:first-of-type{border-top:0}
.pa .bars{margin-left:auto;display:flex;gap:3px;align-items:flex-end;height:26px}
.pa .bars i{width:6px;background:var(--green);border-radius:1px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.p-green{background:#14532d;color:#86efac}.p-blue{background:#1e3a8a;color:#bfdbfe}.p-orange{background:#78350f;color:#fde68a}.p-red{background:#7f1d1d;color:#fecaca}.p-gray{background:#273352;color:#c7d0e6}.p-purple{background:#4c1d95;color:#ddd6fe}
/* page bits */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{margin:0;font-size:24px}
.ph .sub{color:var(--mut);width:100%;margin-top:-6px}
.btn{background:var(--blue);border:0;color:#fff;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:600}
.btn.ghost{background:#16244a;border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.green{background:#15803d}.btn.red{background:#b91c1c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #16234466;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#12204099}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#111d3b;border:1px solid var(--line);padding:7px 13px;border-radius:20px;cursor:pointer;color:#c8d2ea}
.tabs button.on{background:#1d4fd8;border-color:#1d4fd8;color:#fff}
.inp{background:#0a142c;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:0}
.inp:focus{border-color:#3b6cff}
.empty{color:var(--mut);padding:24px;text-align:center}
.lock{max-width:520px;margin:60px auto;text-align:center}
.lock .ic{font-size:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{color:var(--mut);font-size:12px;text-align:center;padding:4px}
.cal .d{min-height:86px;background:#0b1530;border:1px solid var(--line);border-radius:9px;padding:6px;cursor:pointer;font-size:12px;overflow:hidden}
.cal .d.out{opacity:.35}.cal .d.today{border-color:#3b6cff;box-shadow:inset 0 0 0 1px #3b6cff}
.cal .d.sel{background:#14244d}
.cal .ev{background:#1d3a8a;border-radius:4px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{margin-top:16px}
.muted{color:var(--mut)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv span{color:var(--mut)}
.bar{height:9px;background:#18264a;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6bff,#22d3ee)}
.ws-card b{font-size:18px}
.ws-card .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ws-card .nums div{background:#0b1530;border-radius:8px;padding:9px;text-align:center}
.ws-card .nums b{display:block;font-size:20px}
.note{background:#0b1834;border:1px dashed #2c4277;border-radius:10px;padding:10px 14px;color:#b9c6e6;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 14px}
.ov.on{display:flex}
.modal{background:var(--panel);border:1px solid #2a3a66;border-radius:14px;width:100%;max-width:620px;padding:22px}
.modal h3{margin:0 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.form label.full{grid-column:1/-1}
.form .inp{width:100%;color:var(--text)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16244a;border:1px solid #2f4a8a;padding:11px 18px;border-radius:10px;z-index:60;display:none}
.drop{position:absolute;right:0;top:48px;width:340px;background:var(--panel);border:1px solid #2a3a66;border-radius:12px;padding:10px;z-index:40;display:none;text-align:left}
.drop.on{display:block}
.drop div{padding:9px;border-bottom:1px solid var(--line);font-size:13px}
.demo-tag{background:#3b2a05;color:#fcd34d;border:1px solid #6b4e0e;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:8px;vertical-align:middle}
.ckbtn{display:flex;gap:8px;align-items:center;background:#0f2a1c;border:1px solid #1f6b3f;color:#86efac;border-radius:10px;height:42px;padding:0 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.ckbtn.in{background:#3a1414;border-color:#9b2c2c;color:#fecaca}
.chat{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 150px);min-height:480px;padding:0;overflow:hidden}
.chat .chs{border-right:1px solid var(--line);padding:12px;overflow:auto}
.chat .chs .t{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:12px 8px 6px}
.chat .chs a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:#c8d2ea;cursor:pointer}
.chat .chs a:hover{background:#13214a}.chat .chs a.on{background:#1d4fd8;color:#fff}
.chat .msgs{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.chat .list{flex:1;overflow:auto;padding:12px 18px}
.chat .m{display:flex;gap:12px;padding:7px 0}
.chat .m .av{width:36px;height:36px;font-size:13px}
.chat .m small{color:var(--mut);font-size:11px;margin-left:6px}
.chat .m .tx{margin-top:2px;white-space:pre-wrap;word-break:break-word;color:#dbe3f6}
.chat .day{text-align:center;color:var(--mut);font-size:12px;margin:10px 0}
.chat .send{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.chat .send input[type=text]{flex:1;min-width:0}
.gr1{background:#713f12;color:#fde68a}.gr2{background:#9a3412;color:#fed7aa}.gr3{background:#7f1d1d;color:#fecaca}
.dlb{display:inline-flex;gap:6px}
#auth{position:fixed;inset:0;background:radial-gradient(circle at 70% 20%,#1b2d6b,#060c1d 60%);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
#auth .box{width:100%;max-width:400px;background:var(--panel);border:1px solid #2a3a66;border-radius:16px;padding:28px}
#auth .box h2{margin:6px 0 4px}#auth .box p{color:var(--mut);margin:0 0 18px}
#auth label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}#auth .inp{width:100%}
#auth .btn{width:100%;margin-top:18px;padding:12px}#auth .err{color:#fca5a5;font-size:13px;margin-top:10px;min-height:16px}
#auth a{cursor:pointer;font-size:13px}
@media(max-width:1200px){.g4{grid-template-columns:1fr 1fr}.focus{position:relative;inset:auto;width:auto;margin-top:16px}.hero{flex-direction:column;align-items:stretch}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:-280px;width:260px;z-index:45;transition:left .2s}
 .side.open{left:0}
 .burger{display:grid}
 .g2,.g3,.g4{grid-template-columns:1fr}
 .main{padding:14px}
 .hero h1{font-size:28px}.datechip span{display:none}
 .fin b{font-size:20px}.fin>div{padding:4px 8px}
 .form{grid-template-columns:1fr}
 .sched .it{grid-template-columns:110px 20px 1fr}.sched .ln{left:119px}
 .tbl{overflow-x:auto}table{min-width:620px}
 .chat{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:calc(100vh - 120px)}
 .chat .chs{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
 .chat .chs .t{display:none}.chat .chs a{white-space:nowrap}
 .ckbtn span{display:none}
 #curT{display:none}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side" id="side">
  <div class="brand">
   <svg width="54" height="44" viewBox="0 0 54 44"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd77a"/><stop offset="1" stop-color="#d48a12"/></linearGradient></defs><path d="M4 14l11 10 12-20 12 20 11-10-5 24H9z" fill="url(#gd)"/><rect x="9" y="38" width="36" height="5" rx="2" fill="url(#gd)"/><circle cx="4" cy="12" r="3" fill="#ffd77a"/><circle cx="27" cy="3" r="3" fill="#ffd77a"/><circle cx="50" cy="12" r="3" fill="#ffd77a"/></svg>
   <div><b>PEMS</b><small>Personal Executive<br>Management System</small></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="me">
   <div class="row"><div class="av" id="meAv"></div><div><b id="meName"></b><div class="muted" id="meRole" style="font-size:13px"></div></div></div>
   <div class="online"><span class="dot"></span> Online</div>
   <button class="btn ghost" id="signout" style="width:100%;margin-top:12px">⎋ Sign out</button>
  </div>
 </aside>
 <main class="main">
  <div class="top">
   <button class="iconbtn burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
   <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c8d2ea" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="Search anything…  (Ctrl + K)"></div>
   <button class="ckbtn" id="ck" onclick="toggleCheck()"></button>
   <div style="position:relative">
    <button class="iconbtn" id="bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b8cff" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="badge" id="bellN"></span></button>
    <div class="drop" id="drop"></div>
   </div>
   <div class="tabs" id="curT" title="Show totals in"></div>
   <div class="datechip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c8d2ea" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg><span id="today"></span></div>
  </div>
  <div id="page"></div>
 </main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="auth"><div class="box" id="authBox"></div></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const day=o=>{const d=new Date();d.setDate(d.getDate()+o);return iso(d)};
const TODAY=day(0);
const nid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtD=s=>{if(!s)return '';const d=new Date(s+'T00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const fmtT=t=>{if(!t)return '';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return pad(h)+':'+pad(m)+' '+ap};
const SYM={USD:'$',BDT:'৳'};const VIEW=()=>S.settings.view||'BDT';
function conv(n,c){n=Number(n||0);c=c||'USD';const v=VIEW();if(c===v)return n;const r=Number(S.settings.rate)||123;return c==='USD'?n*r:n/r}
const money=n=>(Number(n)<0?'-':'')+SYM[VIEW()]+Math.abs(Number(n||0)).toLocaleString('en-US',{maximumFractionDigits:0});
const moneyC=(n,c)=>SYM[c||'USD']+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}

/* ---------- constants ---------- */
const WS=['Big7Placements','AGL Group','Consulting & Partnerships','Personal Affairs'];
const WS_COL={'Big7Placements':'#2f6bff','AGL Group':'#22c55e','Consulting & Partnerships':'#8b5cf6','Personal Affairs':'#f59e0b'};
let USERS={};
const ALLU=()=>Object.keys(USERS).filter(k=>k!=='x');
const ASSIST=()=>ALLU().filter(k=>/^pa\d/.test(k));
const IC={
 dashboard:'<path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z" fill="currentColor"/>',
 calendar:'<rect x="3" y="4" width="18" height="17" rx="2" fill="currentColor"/><path d="M3 9h18" stroke="#081127" stroke-width="2"/><path d="M8 2v4M16 2v4" stroke="currentColor" stroke-width="2"/><g fill="#081127"><rect x="6" y="12" width="3" height="3"/><rect x="11" y="12" width="3" height="3"/><rect x="16" y="12" width="2" height="3"/></g>',
 tasks:'<rect x="3" y="3" width="18" height="18" rx="3" fill="currentColor"/><path d="M7 12l3 3 7-7" stroke="#081127" stroke-width="2.5" fill="none"/>',
 contacts:'<circle cx="12" cy="8" r="4.5" fill="currentColor"/><path d="M3 21c0-5 4-8 9-8s9 3 9 8z" fill="currentColor"/>',
 documents:'<path d="M5 2h10l5 5v15H5z" fill="currentColor"/><path d="M15 2v5h5" fill="#081127" opacity=".4"/>',
 portfolio:'<rect x="3" y="8" width="18" height="13" rx="2" fill="currentColor"/><path d="M8 8V5h3v3M13 8V3h3v5" stroke="currentColor" stroke-width="2" fill="none"/>',

function collectForm(){const o={};for(const [k,v] of new FormData($('#fm')).entries()){if(k!=='file')o[k]=v}return o}
async function saveForm(){
 const {ek,id}=FORM;const E=ENT[ek];const fd=new FormData($('#fm'));const o={};let file=null;
 for(const [k,v] of fd.entries()){if(k==='file'){if(v&&v.name)file=v}else o[k]=v}
 E.fields.forEach(([k,l,t])=>{if(t==='number'&&k in o)o[k]=Number(o[k]||0)});
 if(ek==='incentives'&&!(o.amount>0)){toast('Enter an amount');return}
 if(ek==='att'&&!o.in){toast('Enter check-in time');return}
 if(ek==='docs'&&file&&!o.title)o.title=file.name.replace(/\.[^.]+$/,'');
 if(!String(o[E.main]||'').trim()){toast('Please fill in '+E.fields.find(f=>f[0]===E.main)[1].toLowerCase());return}
 if(ek==='docs'&&!id&&!file){toast('Please choose a file');return}
 if(ek==='tx'){o.amount=Number(o.amount||0);if(!(o.amount>0)){toast('Enter an amount');return}}
 const old=id?S[ek].find(x=>x.id===id):null;
 const btn=[...document.querySelectorAll('#modal .acts .btn')].pop();if(btn){btn.disabled=true;btn.textContent='Saving…'}
 try{
  if(ek==='docs'&&file){
   if(file.size>20e6){toast('File is larger than 20 MB');throw new Error('size')}
   const key='docs/'+crypto.randomUUID()+'/'+file.name.replace(/[^\w.\-]+/g,'_');
   const up=await sb.storage.from('pems-files').upload(key,file);
   if(up.error){toast('Upload failed: '+up.error.message);throw up.error}
   o.key=key;o.file=file.name;o.size=file.size>1e6?(file.size/1e6).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1e3))+' KB';if(old)o.ver=(old.ver||1)+1}
  if(!id){if(ek==='tx')o.status=ME==='p'?'Approved':'Pending';if(ek==='appts'||ek==='meetings')o.gcal=!!S.notify.cal}
  await dbSave(ek,o,id);
 }catch(e){if(btn){btn.disabled=false;btn.textContent='Save'}return}
 if(old){
  if(ek==='tasks'&&o.status==='Completed'&&old.status!=='Completed')log('Completed task',o.title);else log('Updated '+E.label.toLowerCase(),o[E.main]);
  if(ek==='tasks'&&o.status==='Review'&&old.status!=='Review')mail('tasks','Task ready for your review: '+o.title)}
 else{const r=o;
  if(ek==='docs')log('Uploaded document',r.title);
  else if(ek==='tx'){log(ME==='p'?'Added transaction':'Submitted '+r.type.toLowerCase()+' for approval',r.cat+' '+moneyC(r.amount,r.c));if(ME!=='p')mail('approvals','Approval needed: '+r.cat+' '+moneyC(r.amount,r.c),'Submitted by '+uname(ME)+'. '+(r.note||''))}
  else if(ek==='warnings'){const st=S.staff.find(s=>s.id===r.staff);log('Issued official warning',r.grade+' — '+(st?st.name:''));mail('warnings','Official warning '+r.grade+' issued to '+(st?st.name:''),r.reason)}
  else if(ek==='incentives'){const st=S.staff.find(s=>s.id===r.staff);log('Added payroll '+r.type.toLowerCase(),(st?st.name:'')+' '+moneyC(r.amount,r.c))}
  else if(ek==='appts'||ek==='meetings'){log('Added '+E.label.toLowerCase(),r[E.main]);mail('meetings','New '+(ek==='appts'?'appointment':'meeting')+': '+r[E.main]+' — '+fmtD(r.date)+(r.start?' '+fmtT(r.start):''),S.notify.cal?'Calendar: '+S.notify.calEmail:'')}
  else if(ek==='tasks'){log('Added task',r.title);if(r.status==='Review')mail('tasks','Task ready for your review: '+r.title)}
  else log('Added '+E.label.toLowerCase(),r[E.main])}
 closeM();render();toast('Saved')
}

const statusPill=s=>`<span class="pill ${{Completed:'p-green','In Progress':'p-blue',Waiting:'p-orange',Review:'p-purple','Not Started':'p-gray',Approved:'p-green',Pending:'p-orange',Rejected:'p-red',Planned:'p-blue',Booked:'p-green',Cancelled:'p-red'}[s]||'p-gray'}">${esc(s)}</span>`;

function spark(col,seed){let d='M0 50';let y=40;for(let i=1;i<=12;i++){y=Math.max(8,Math.min(52,y-6+((i*seed*7)%13)-3));d+=` L${i*10} ${y}`}return `<svg class="spark" viewBox="0 0 120 56" preserveAspectRatio="none"><defs><linearGradient id="sg${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L120 56 L0 56Z" fill="url(#sg${seed})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2"/></svg>`}
function donut(parts,center,sub){const C=2*Math.PI*62;let off=0;const tot=parts.reduce((a,p)=>a+p.v,0)||1;
 return `<svg viewBox="0 0 200 200" width="200" height="200" style="max-width:100%"><circle cx="100" cy="100" r="62" fill="none" stroke="#18264a" stroke-width="26"/>${parts.map(p=>{const len=p.v/tot*C;const s=`<circle cx="100" cy="100" r="62" fill="none" stroke="${p.c}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len;return s}).join('')}<text x="100" y="98" text-anchor="middle" fill="#fff" font-size="${String(center).length>9?15:21}" font-weight="800">${center}</text><text x="100" y="120" text-anchor="middle" fill="#c8d2ea" font-size="12">${sub}</text></svg>`}

function prevMonthTx(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const m=iso(d).slice(0,7);return S.tx.filter(t=>t.date.slice(0,7)===m&&t.status==='Approved')}
const sum=(a,type)=>a.filter(t=>!type||t.type===type).reduce((s,t)=>s+conv(t.amount,t.c),0);
const pct=(a,b)=>b?Math.round((a-b)/b*100):0;

let CALM=null,CALSEL=TODAY;

 if(!CALM){const d=new Date();CALM=[d.getFullYear(),d.getMonth()]}
 const [Y,M]=CALM;const first=new Date(Y,M,1);const start=new Date(Y,M,1-((first.getDay()+6)%7));
 const ap=S.appts.filter(visible);
 let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const ev=ap.filter(a=>a.date===k).sort((a,b)=>a.start.localeCompare(b.start));
  cells+=`<div class="d ${d.getMonth()!==M?'out':''} ${k===TODAY?'today':''} ${k===CALSEL?'sel':''}" onclick="CALSEL='${k}';render()"><b>${d.getDate()}</b>${ev.slice(0,2).map(a=>`<div class="ev" style="background:${WS_COL[a.ws]}55">${fmtT(a.start).replace(':00','')} ${esc(a.title)}</div>`).join('')}${ev.length>2?`<div class="muted">+${ev.length-2} more</div>`:''}</div>`}

let FT='all';
PAGES.finance=function(){
 const P=ME==='p';
 const rows=(P?S.tx:S.tx.filter(t=>t.by===ME)).filter(t=>FT==='all'||(FT==='pending'?t.status==='Pending':t.type===FT)).sort((a,b)=>b.date.localeCompare(a.date));
 let top='';
 if(P){const m=monthTx(),inc=sum(m,'Income'),exp=sum(m,'Expense');const pend=S.tx.filter(t=>t.status==='Pending');
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=iso(d).slice(0,7);const a=S.tx.filter(t=>t.date.slice(0,7)===k&&t.status==='Approved');months.push({k:d.toLocaleDateString('en-US',{month:'short'}),i:sum(a,'Income'),e:sum(a,'Expense')})}
  const mx=Math.max(...months.map(x=>Math.max(x.i,x.e)),1);
  const chart=`<svg viewBox="0 0 420 190" width="100%">${months.map((x,j)=>{const X=20+j*68;const hi=x.i/mx*140,he=x.e/mx*140;return `<rect x="${X}" y="${160-hi}" width="22" height="${hi}" rx="3" fill="#22c55e"/><rect x="${X+25}" y="${160-he}" width="22" height="${he}" rx="3" fill="#ef4444"/><text x="${X+23}" y="178" fill="#8d9abb" font-size="11" text-anchor="middle">${x.k}</text>`}).join('')}</svg><div class="muted" style="font-size:12px"><span style="color:#22c55e">■</span> Income &nbsp; <span style="color:#ef4444">■</span> Expenses</div>`;
  const cats={};m.filter(t=>t.type==='Expense').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+conv(t.amount,t.c));const cmx=Math.max(...Object.values(cats),1);
  top=`<div class="grid g4"><div class="card"><div class="muted">Income this month</div><b style="font-size:26px" class="up">${money(inc)}</b></div><div class="card"><div class="muted">Expenses this month</div><b style="font-size:26px" class="dn">${money(exp)}</b></div><div class="card"><div class="muted">Net position</div><b style="font-size:26px">${money(inc-exp)}</b></div><div class="card"><div class="muted">Waiting for your approval</div><b style="font-size:26px;color:#f59e0b">${pend.length}</b> <span class="muted">${money(sum(pend))}</span></div></div>
  <div class="grid g2 mt"><div class="card"><h3>Cash flow — last 6 months</h3>${chart}</div><div class="card"><h3>Expenses by category — this month</h3>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>${esc(c)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/cmx*100}%"></i></div></div>`).join('')||'<div class="empty">No expenses yet</div>'}</div></div>`}

 return `<div class="ph"><h2>${P?'Personal Finance':'Finance — record entry'}</h2><div class="right">${P?'<button class="btn ghost" onclick="copyCSV()">Copy CSV</button>':''}<button class="btn" onclick="openForm('tx')">+ ${P?'Add transaction':'Submit entry'}</button></div></div>${top}

 <div class="card tbl"><table><tr><th>Date</th><th>Category</th><th>Engagement</th><th>Entered by</th><th style="text-align:right">Amount</th><th>Status</th><th></th></tr>

async function setPerm(k,m,v){const r=await sb.from('permissions').upsert({user_id:UID[k],module:m,level:v});if(r.error){toast(r.error.message);return}log('Changed permission',USERS[k].role+': '+m+' → '+v);await loadMeta();render();toast('Permission updated')}
async function setWS(k,w,on){const r=on?await sb.from('workspace_access').insert({user_id:UID[k],workspace:w}):await sb.from('workspace_access').delete().eq('user_id',UID[k]).eq('workspace',w);if(r.error){toast(r.error.message);return}log('Changed workspace access',USERS[k].role+': '+w+(on?' granted':' removed'));await loadMeta();render()}
async function setActive(k,on){const r=await sb.from('profiles').update({active:on}).eq('id',UID[k]);if(r.error){toast(r.error.message);return}log(on?'Restored access':'Revoked access',USERS[k].role);await loadMeta();render();toast(on?'Access restored':'Access revoked — blocked immediately')}
async function restore(i){const a=S.archived[i];try{await dbSave(a.ek,{},a.r.id,{archived:false})}catch(e){return}log('Restored '+ENT[a.ek].label.toLowerCase(),a.r[ENT[a.ek].main]);render();toast('Restored')}
async function renameMe(v){v=v.trim();if(!v)return;const r=await sb.from('profiles').update({name:v}).eq('id',MYUID);if(r.error){toast(r.error.message);return}await loadMeta();render();toast('Name updated')}

function mail(kind,subject,body){const N=S.notify;if(!N||!N.on||!N.ev[kind]||!N.email)return;S.outbox.unshift({t:new Date().toISOString(),to:N.email,subject,body:body||'',kind});sb.from('email_outbox').insert({to_email:N.email,subject,body:body||'',kind}).then(()=>{})}
async function setCal(on){S.notify.cal=on;await saveSettings();await sb.from('appointments').update({gcal:on}).not('id','is',null);await sb.from('meetings').update({gcal:on}).not('id','is',null);await loadTable('appts');await loadTable('meetings');log(on?'Turned on Google Calendar sync':'Turned off Google Calendar sync',S.notify.calEmail);render();toast(on?'Calendar sync on for '+S.notify.calEmail:'Calendar sync off')}
function gcalUrl(r){const f=(d,t)=>String(d||TODAY).replace(/-/g,'')+'T'+String(t||'10:00').replace(':','')+'00';const title=r.title||'';const st=r.start||'10:00',en=r.end||(r.start?r.start:'11:00');
 const details=[r.notes,r.agenda&&'Agenda: '+r.agenda,r.attendees&&'Attendees: '+r.attendees,r.participants&&'Participants: '+r.participants,'From PEMS'].filter(Boolean).join('\n');
 return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+f(r.date,st)+'/'+f(r.date,en)+'&ctz='+encodeURIComponent(S.notify.tz||'Asia/Dhaka')+'&location='+encodeURIComponent(r.loc||'')+'&details='+encodeURIComponent(details)+(S.notify.calEmail?'&add='+encodeURIComponent(S.notify.calEmail):'')}

/* ---------- attendance ---------- */
const ini=u=>uname(u).split(' ').map(s=>s[0]).slice(0,2).join('');
function openSession(u){return S.att.find(a=>a.user===u&&!a.out)}
function mins(a){const [h1,m1]=a.in.split(':').map(Number);let e;if(a.out){const [h2,m2]=a.out.split(':').map(Number);e=h2*60+m2}else{const n=new Date();e=a.date===TODAY?n.getHours()*60+n.getMinutes():24*60}return Math.max(0,e-(h1*60+m1))}
const hm=m=>Math.floor(m/60)+'h '+pad(m%60)+'m';
async function toggleCheck(){if(ME!=='p'&&!S.perms[ME].active)return;const s=openSession(ME);const n=new Date();const t=pad(n.getHours())+':'+pad(n.getMinutes());
 try{if(s){await dbSave('att',{out:s.date!==TODAY?'23:59':t},s.id);const x=S.att.find(a=>a.id===s.id)||s;log('Checked out',hm(mins(x))+' worked');toast('Checked out — '+hm(mins(x))+' worked')}
 else{await dbSave('att',{user:ME,date:TODAY,in:t});const x=openSession(ME);log('Checked in',x?fmtT(x.in):'');toast('Checked in at '+(x?fmtT(x.in):fmtT(t)))}}catch(e){}
 render()}

setInterval(updCk,30000);

/* ---------- chat ---------- */
let CH='general';
const wsSlug=w=>w.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function channels(){const c=[{id:'general',name:'general'}];WS.filter(w=>w!=='Personal Affairs').forEach(w=>{if(ME==='p'||myWS().includes(w))c.push({id:'ws:'+w,name:wsSlug(w)})});return c}
async function addWorkspace(){const i=$('#newWS');const n=i.value.trim();if(!n)return;if(WS.some(w=>w.toLowerCase()===n.toLowerCase())){toast('That workspace already exists');return}const pal=['#06b6d4','#ec4899','#84cc16','#eab308','#14b8a6','#f97316','#a855f7'];const col=pal[(S.workspaces.length+pal.length-4)%pal.length];const r=await sb.from('workspaces').insert({name:n,color:col});if(r.error){toast(r.error.message);return}log('Added workspace',n);await loadMeta();render();toast('Workspace added — give assistants access below')}
function dms(){return ALLU().filter(u=>u!==ME&&USERS[u].active!==false).map(o=>({id:'dm-'+[ME,o].sort().join('-'),other:o}))}
function myChannels(){return channels().map(c=>c.id).concat(dms().map(d=>d.id))}
function unread(ch){const seen=(S.chatSeen[ME]||{})[ch]||'';return S.chat.filter(m=>m.ch===ch&&m.from!==ME&&m.t>seen).length}
function unreadTotal(){if(ME!=='p'&&!S.perms[ME].active)return 0;return myChannels().reduce((a,c)=>a+(c===CH&&ROUTE==='chat'?0:unread(c)),0)}
async function sendMsg(){const i=$('#msg');const v=i.value.trim();if(!v)return;i.value='';try{await dbSave('chat',{ch:CH,from:ME,text:v})}catch(e){i.value=v;return}render();setTimeout(()=>{const x=$('#msg');if(x)x.focus()},20)}
async function sendFile(inp){const f=inp.files[0];if(!f)return;if(f.size>20e6){toast('File is larger than 20 MB');return}const key='chat/'+crypto.randomUUID()+'/'+f.name.replace(/[^\w.\-]+/g,'_');toast('Uploading…');const up=await sb.storage.from('pems-files').upload(key,f);if(up.error){toast('Upload failed: '+up.error.message);return}try{await dbSave('chat',{ch:CH,from:ME,text:'📎 '+f.name+' ('+Math.max(1,Math.round(f.size/1024))+' KB)',fileKey:key,fileName:f.name})}catch(e){return}log('Shared file in chat',f.name);render()}
PAGES.chat=function(){
 if(!myChannels().includes(CH))CH='general';
 S.chatSeen[ME]=S.chatSeen[ME]||{};const _now=new Date().toISOString();if(((S.chatSeen[ME][CH])||'')<((S.chat.filter(m=>m.ch===CH).map(m=>m.t).sort().pop())||'')||!S.chatSeen[ME][CH]){S.chatSeen[ME][CH]=_now;sb.from('chat_seen').upsert({user_id:MYUID,channel:chToDb(CH),seen_at:_now}).then(()=>{})}
 const msgs=S.chat.filter(m=>m.ch===CH).sort((a,b)=>a.t.localeCompare(b.t));let lastDay='';
 const _dm=dms().find(d=>d.id===CH);const title=CH.startsWith('dm-')?'@ '+(_dm?uname(_dm.other):'?'):'# '+(CH.startsWith('ws:')?wsSlug(CH.slice(3)):CH);
 const ub=c=>{const n=c===CH?0:unread(c);return n?`<span class="badge" style="margin-left:auto">${n}</span>`:''};
 return `<div class="card chat"><div class="chs"><div class="t">Channels</div>${channels().map(c=>`<a class="${CH===c.id?'on':''}" onclick="CH='${esc(c.id).replace(/'/g,'\\\'')}';render()"># ${c.name}${ub(c.id)}</a>`).join('')}<div class="t">Direct messages</div>${dms().map(d=>`<a class="${CH===d.id?'on':''}" onclick="CH='${d.id}';render()"><span class="dot" style="background:${openSession(d.other)?'var(--green)':'#64748b'}"></span>${esc(uname(d.other))}${ub(d.id)}</a>`).join('')}</div>
 <div class="msgs"><div class="hd">${esc(title)} <span class="muted" style="font-weight:400;font-size:12px;margin-left:8px">${CH==='general'?'Everyone':CH.startsWith('dm-')?'Private conversation':'Only people with access to this workspace'}</span></div>
 <div class="list" id="mlist">${msgs.map(m=>{const d=m.t.slice(0,10);const sep=d!==lastDay?`<div class="day">${fmtD(d)}</div>`:'';lastDay=d;return sep+`<div class="m"><div class="av" style="background:${(USERS[m.from]||USERS.x).col}">${ini(m.from)}</div><div><b>${esc(uname(m.from))}</b><small>${new Date(m.t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</small><div class="tx">${m.fileKey?`<a style="cursor:pointer" onclick="openFile('${esc(m.fileKey)}')">${esc(m.text)}</a>`:esc(m.text)}</div></div></div>`}).join('')||'<div class="empty">No messages yet — say hello 👋</div>'}</div>
 ${can('chat','edit')?`<div class="send"><label class="btn ghost" title="Attach file" style="display:grid;place-items:center">📎<input type="file" style="display:none" onchange="sendFile(this)"></label><input id="msg" type="text" class="inp" placeholder="Message ${esc(title)}" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">Send</button></div>`:''}</div></div>
`;
};

/* ---------- attendance page ---------- */
let AR='week';
PAGES.attendance=function(){
 const P=ME==='p';const ed=can('attendance','edit');const users=P||ed?ASSIST().concat(['p']):[ME];
 const from=AR==='today'?TODAY:AR==='week'?weekStart(TODAY):AR==='month'?TODAY.slice(0,7)+'-01':day(-30);
 const rows=S.att.filter(a=>users.includes(a.user)&&a.date>=from).sort((a,b)=>(b.date+b.in).localeCompare(a.date+a.in));
 const now=users.map(u=>{const s=openSession(u);const tm=S.att.filter(a=>a.user===u&&a.date===TODAY).reduce((x,a)=>x+mins(a),0);return `<div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="background:${USERS[u].col}">${ini(u)}</div><div><b>${esc(uname(u))}</b><div class="muted" style="font-size:12px">${USERS[u].role}</div></div><span style="margin-left:auto" class="pill ${s?'p-green':'p-gray'}">${s?'● Working':'Off'}</span></div><div class="muted mt" style="font-size:13px">${s?'Checked in at '+fmtT(s.in):'Not checked in now'} · Today: <b style="color:#fff">${hm(tm)}</b></div></div>`}).join('');
 const summ=users.map(u=>{const a=rows.filter(x=>x.user===u);const tot=a.reduce((x,y)=>x+mins(y),0);const days=new Set(a.map(x=>x.date)).size;const late=a.filter(x=>x.in>S.settings.late).length;return `<tr><td><b>${esc(uname(u))}</b><div class="muted" style="font-size:12px">${USERS[u].role}</div></td><td>${days}</td><td><b>${hm(tot)}</b></td><td>${days?hm(Math.round(tot/days)):'—'}</td><td class="${late?'dn':''}">${late}</td></tr>`}).join('');

 const objs=[null,null,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];const kids=[];

 const mt=S.meetings.filter(visible).filter(m=>inR(m.date));
 const users=P?ASSIST().concat(['p']):[ME];const att=S.att.filter(a=>users.includes(a.user)&&inR(a.date)).sort((a,b)=>(a.date+a.in).localeCompare(b.date+b.in));
 const hours=users.map(u=>{const a=att.filter(x=>x.user===u);return [uname(u),USERS[u].role,new Set(a.map(x=>x.date)).size,hm(a.reduce((s,x)=>s+mins(x),0)),a.filter(x=>x.in>S.settings.late).length]}).filter(r=>r[2]>0||!P);
 const fin=P?S.tx.filter(t=>inR(t.date)).sort((a,b)=>a.date.localeCompare(b.date)):[];const finA=fin.filter(t=>t.status==='Approved');const warn=P?S.warnings.filter(w=>inR(w.date)):[];
 const summary=[['Period',fmtD(from)+' - '+fmtD(to)],['Prepared for',P?uname('p')+' (Principal)':uname(ME)],['Appointments',ap.length],['Meetings recorded',mt.length],['Tasks completed',tasks.length-open.length],['Tasks open',open.length],['Tasks overdue',open.filter(t=>t.due<TODAY).length],['Follow-ups due (7 days)',S.contacts.filter(c=>visible(c)&&c.next&&c.next<=day(7)).length],['Documents added',S.docs.filter(d=>visible(d)&&inR(d.date)).length],['Hours worked',hm(att.reduce((s,x)=>s+mins(x),0))]];
 if(P)summary.push(['Income',money(sum(finA,'Income'))],['Expenses',money(sum(finA,'Expense'))],['Approvals pending',S.tx.filter(t=>t.status==='Pending').length+S.tasks.filter(t=>t.status==='Review').length],['Warnings issued',warn.length]);
 return {summary,tasks,open,ap,mt,att,hours,fin,warn}}
const sname=id=>{const s=S.staff.find(x=>x.id===id);return s?s.name:''};
function reportPDF(from,to){const R=reportData(from,to);const d=new PDFDoc();d.header('Weekly Management Report',fmtD(from)+' - '+fmtD(to)+(ME==='p'?'':' | '+uname(ME)));
 d.h('Summary');d.kv(R.summary.slice(2));
 d.h('Open tasks');d.table(['Task','Assignee','Due','Priority','Status','Workspace'],R.open.map(t=>[t.title,uname(t.assignee),fmtD(t.due),t.priority,t.status,t.ws]),[160,80,65,50,65,95]);
 d.h('Appointments');d.table(['Date','Time','Title','Location','Workspace'],R.ap.map(a=>[fmtD(a.date),fmtT(a.start),a.title,a.loc,a.ws]),[70,60,165,110,110]);
 d.h('Meetings & decisions');d.table(['Date','Meeting','Decisions','Action items'],R.mt.map(m=>[fmtD(m.date),m.title,m.decisions,m.actions]),[65,140,150,160]);
 d.h('Attendance');d.table(['Person','Role','Days','Hours','Late'],R.hours,[150,160,60,90,55],[2,3,4]);
 if(ME==='p'){d.h('Finance');d.table(['Date','Type','Category','Workspace','Status','Amount'],R.fin.map(t=>[fmtD(t.date),t.type,t.cat,t.ws,t.status,(t.type==='Income'?'+':'-')+moneyC(t.amount,t.c)]),[70,60,110,125,65,85],[5]);
  if(R.warn.length){d.h('Official warnings');d.table(['Date','Staff','Grade','Reason'],R.warn.map(w=>[fmtD(w.date),sname(w.staff),w.grade,w.reason]),[70,120,70,255])}}
 log('Downloaded weekly report PDF',fmtD(from));save();saveFile('PEMS_Weekly_Report_'+from+'.pdf',d.out())}
function reportXLSX(from,to){const R=reportData(from,to);const sh=[['Summary',[['Item','Value']].concat(R.summary)],['Tasks',[['Task','Assignee','Due','Priority','Status','Workspace']].concat(R.tasks.map(t=>[t.title,uname(t.assignee),t.due,t.priority,t.status,t.ws]))],['Appointments',[['Date','Start','End','Title','Location','Workspace']].concat(R.ap.map(a=>[a.date,a.start,a.end,a.title,a.loc,a.ws]))],['Meetings',[['Date','Meeting','Participants','Decisions','Action items']].concat(R.mt.map(m=>[m.date,m.title,m.participants,m.decisions,m.actions]))],['Attendance',[['Date','Person','Check in','Check out','Hours']].concat(R.att.map(a=>[a.date,uname(a.user),a.in,a.out||'working',Math.round(mins(a)/6)/10]))]];
 if(ME==='p'){sh.push(['Finance',[['Date','Type','Category','Workspace','Status','Entered by','Amount','Currency','Amount in '+VIEW()]].concat(R.fin.map(t=>[t.date,t.type,t.cat,t.ws,t.status,uname(t.by),Number(t.amount),t.c||'USD',Math.round(conv(t.amount,t.c))]))]);sh.push(['Warnings',[['Date','Staff','Grade','Action','Reason']].concat(R.warn.map(w=>[w.date,sname(w.staff),w.grade,w.action,w.reason]))])}
 log('Downloaded weekly report Excel',fmtD(from));save();saveFile('PEMS_Weekly_Report_'+from+'.xlsx',xlsxBlob(sh))}
function payrollPDF(m){const rows=payrollRows(m);const d=new PDFDoc();d.header('Payroll - '+monthName(m),'Monthly salary, incentives and deductions');
 d.h('Payroll summary');d.table(['Staff','Designation','Days','Basic','Incentives','Deductions','Net pay'],rows.map(r=>[r.s.name,r.s.role,r.days===null?'-':r.days,money(r.base),money(r.plus),money(r.minus),money(r.net)]).concat([['Total','','',money(rows.reduce((a,r)=>a+r.base,0)),money(rows.reduce((a,r)=>a+r.plus,0)),money(rows.reduce((a,r)=>a+r.minus,0)),money(rows.reduce((a,r)=>a+r.net,0))]]),[110,115,40,60,65,65,60],[2,3,4,5,6]);
 rows.forEach(r=>{d.newPage();d.header('Payslip - '+monthName(m),r.s.name+' | '+r.s.role);
  d.h('Employee');d.kv([['Name',r.s.name],['Designation',r.s.role],['Joining date',fmtD(r.s.joined)||'-'],['Days present',r.days===null?'-':String(r.days)],['Pay period',monthName(m)],['Phone',r.s.phone||'-']]);
  d.h('Earnings');d.table(['Description','Note','Amount'],[['Basic salary','',money(r.base)]].concat(r.it.filter(i=>!isMinus(i.type)).map(i=>[i.type,i.note,money(conv(i.amount,i.c))])),[180,230,105],[2]);
  d.h('Deductions');d.table(['Description','Note','Amount'],r.it.filter(i=>isMinus(i.type)).map(i=>[i.type,i.note,money(conv(i.amount,i.c))]),[180,230,105],[2]);
  d.need(60);d.rect(40,d.y-6,515,34,'#0c1630');d.text(52,d.y+15,'NET PAY',{size:12,bold:true,color:'#ffffff'});d.text(545,d.y+15,money(r.net),{size:14,bold:true,color:'#f5b942',align:'right'});d.y+=80;
  d.need(40);d.rect(40,d.y,180,1,'#64748b');d.rect(375,d.y,180,1,'#64748b');d.text(40,d.y+14,'Employee signature',{size:8.5,color:'#64748b'});d.text(375,d.y+14,'Authorised by '+uname('p'),{size:8.5,color:'#64748b'})});
 log('Downloaded payslips PDF',monthName(m));save();saveFile('PEMS_Payroll_'+m+'.pdf',d.out())}
function payrollXLSX(m){const rows=payrollRows(m);const sh=[['Payroll '+m,[['Staff','Designation','Days present','Basic salary ('+VIEW()+')','Incentives ('+VIEW()+')','Deductions ('+VIEW()+')','Net pay ('+VIEW()+')']].concat(rows.map(r=>[r.s.name,r.s.role,r.days===null?'':r.days,Math.round(r.base),Math.round(r.plus),Math.round(r.minus),Math.round(r.net)])).concat([['Total','','',rows.reduce((a,r)=>a+r.base,0),rows.reduce((a,r)=>a+r.plus,0),rows.reduce((a,r)=>a+r.minus,0),rows.reduce((a,r)=>a+r.net,0)]])],['Adjustments',[['Staff','Type','Note','Amount','Currency']].concat(rows.flatMap(r=>r.it.map(i=>[r.s.name,i.type,i.note,(isMinus(i.type)?-1:1)*Number(i.amount),i.c||'USD'])))]];
 log('Downloaded payroll Excel',monthName(m));save();saveFile('PEMS_Payroll_'+m+'.xlsx',xlsxBlob(sh))}

function pSearch(){
 const q=QUERY.toLowerCase();if(!q)return '<div class="card empty">Type in the search box and press Enter</div>';
 const groups=[['appts','calendar','Appointments'],['tasks','tasks','Tasks'],['contacts','contacts','Contacts'],['docs','documents','Documents'],['meetings','meetings','Meetings'],['travel','travel','Travel']];
 let h=`<div class="ph"><h2>Search: “${esc(QUERY)}”</h2></div>`;let n=0;
 groups.forEach(([ek,mod,l])=>{if(!can(mod))return;const r=S[ek].filter(visible).filter(x=>JSON.stringify(x).toLowerCase().includes(q));if(!r.length)return;n+=r.length;
  h+=`<div class="card mt"><h3>${l} <span class="muted">${r.length}</span></h3>${r.map(x=>`<div class="pa" style="cursor:pointer" onclick="openForm('${ek}','${x.id}')"><b>${esc(x[ENT[ek].main])}</b><span style="margin-left:auto">${wsPill(x.ws)}</span></div>`).join('')}</div>`});
 return n?h:h+'<div class="card empty">No results you have access to</div>';
}
